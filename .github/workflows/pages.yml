name: Publish Debooger
on:
  push:
    branches: [main]
    paths:
      - 'D2-B*.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact active version
        run: |
          set -euo pipefail
          mkdir -p _site
          test -s D2-B024.html
          cp D2-B024.html _site/index.html
          cp D2-B024.html _site/D2-B024.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
